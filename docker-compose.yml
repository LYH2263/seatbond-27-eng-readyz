services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatbond
      POSTGRES_PASSWORD: seatbond
      POSTGRES_DB: seatbond
    ports: ["5442:5432"]
    volumes: [seatbond_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbond -d seatbond"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://seatbond:seatbond@db:5432/seatbond
      SEED_ON_EMPTY: "true"
    ports: ["9100:9100"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 就绪探针：数据库不可达或超时时返回 503，urlopen 抛错即非健康
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://localhost:9100/api/readyz', timeout=3); sys.exit(0 if json.load(r).get('status') == 'ready' else 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  frontend:
    build: ./frontend
    ports: ["4100:80"]
    depends_on: [api]
volumes:
  seatbond_pg:
